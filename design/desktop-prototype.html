                                <td class="py-3 px-3 text-stone-700">Dewi Anggraini</td>
                                <td class="py-3 px-3 font-black text-stone-900">Rp 300.000</td>
                                <td class="py-3 px-3"><span class="px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700 text-[10px] font-bold">Dalam Proses</span></td>
                                <td class="py-3 px-3 text-stone-600">26 Nov 2026</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `
    };

    // Add aliases for remaining menus
    pages.payments = pages.finance;
    pages.templates = pages.deeds;
    pages.attendance_report = pages.attendance;
    pages.productivity = pages.stats;
    pages.users = pages.settings;

    function navigateTo(pageKey) {
        const contentArea = document.getElementById('mainContent');
        if (pages[pageKey]) {
            contentArea.innerHTML = pages[pageKey];
        } else {
            contentArea.innerHTML = pages.dashboard;
        }

        // Update active class on sidebar
        document.querySelectorAll('.nav-item').forEach(el => {
            if (el.getAttribute('data-page') === pageKey) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });

        // Scroll to top
        document.querySelector('.h-screen.overflow-y-auto').scrollTop = 0;
    }

    // Default load dashboard
    navigateTo('dashboard');
    </script>
